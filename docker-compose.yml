services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: vault-flow

    ports:
      - "5000:5000"

    volumes:
      - ./data:/app/data
      - ./downloads:/app/downloads
      - ./providers:/app/providers

    environment:
      SERVE_STATIC: "true"
      WEB_HOST: "0.0.0.0"
      WEB_PORT: "5000"
      MAX_RUNNING_TASKS: "2"

    restart: unless-stopped

    init: true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:5000/ || exit 1"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s