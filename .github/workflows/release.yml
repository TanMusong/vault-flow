name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: release
        shell: bash
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"

          PREVIOUS_TAG=$(git tag --sort=-version:refname \
            | grep '^v' \
            | grep -v "^${CURRENT_TAG}$" \
            | head -n 1 || true)

          echo "Current tag: ${CURRENT_TAG}"
          echo "Previous tag: ${PREVIOUS_TAG:-none}"

          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE="${PREVIOUS_TAG}..${CURRENT_TAG}"
          else
            RANGE="${CURRENT_TAG}"
          fi

          FEATURES=""
          FIXES=""
          REFACTORS=""
          DOCS=""
          PERFORMANCE=""
          TESTS=""
          BUILD=""
          CI=""
          CHORES=""
          OTHER=""

          while IFS= read -r line; do
            SUBJECT=$(echo "$line" | cut -d'|' -f1)
            HASH=$(echo "$line" | cut -d'|' -f2)
            TYPE=$(echo "$SUBJECT" | sed -nE 's/^([a-zA-Z]+)(\(.+\))?!?:.*/\1/p')

            COMMIT="  - ${SUBJECT} ([${HASH}](https://github.com/${GITHUB_REPOSITORY}/commit/${HASH}))"

            case "${TYPE}" in
              feat)
                FEATURES="${FEATURES}${COMMIT}"$'\n'
                ;;
              fix)
                FIXES="${FIXES}${COMMIT}"$'\n'
                ;;
              refactor)
                REFACTORS="${REFACTORS}${COMMIT}"$'\n'
                ;;
              docs)
                DOCS="${DOCS}${COMMIT}"$'\n'
                ;;
              perf)
                PERFORMANCE="${PERFORMANCE}${COMMIT}"$'\n'
                ;;
              test)
                TESTS="${TESTS}${COMMIT}"$'\n'
                ;;
              build)
                BUILD="${BUILD}${COMMIT}"$'\n'
                ;;
              ci)
                CI="${CI}${COMMIT}"$'\n'
                ;;
              chore)
                CHORES="${CHORES}${COMMIT}"$'\n'
                ;;
              *)
                OTHER="${OTHER}${COMMIT}"$'\n'
                ;;
            esac
          done < <(
            git log "$RANGE" \
              --pretty=format:"%s|%H"
          )

          {
            if [ -n "$FEATURES" ]; then
              echo "## Features"
              echo
              printf "%s" "$FEATURES"
              echo
            fi

            if [ -n "$FIXES" ]; then
              echo "## Bug Fixes"
              echo
              printf "%s" "$FIXES"
              echo
            fi

            if [ -n "$REFACTORS" ]; then
              echo "## Refactoring"
              echo
              printf "%s" "$REFACTORS"
              echo
            fi

            if [ -n "$PERFORMANCE" ]; then
              echo "## Performance"
              echo
              printf "%s" "$PERFORMANCE"
              echo
            fi

            if [ -n "$DOCS" ]; then
              echo "## Documentation"
              echo
              printf "%s" "$DOCS"
              echo
            fi

            if [ -n "$TESTS" ]; then
              echo "## Tests"
              echo
              printf "%s" "$TESTS"
              echo
            fi

            if [ -n "$BUILD" ]; then
              echo "## Build"
              echo
              printf "%s" "$BUILD"
              echo
            fi

            if [ -n "$CI" ]; then
              echo "## CI"
              echo
              printf "%s" "$CI"
              echo
            fi

            if [ -n "$CHORES" ]; then
              echo "## Chores"
              echo
              printf "%s" "$CHORES"
              echo
            fi

            if [ -n "$OTHER" ]; then
              echo "## Other Changes"
              echo
              printf "%s" "$OTHER"
              echo
            fi
          } > release-notes.md

          echo "current_tag=${CURRENT_TAG}" >> "$GITHUB_OUTPUT"
          echo "previous_tag=${PREVIOUS_TAG}" >> "$GITHUB_OUTPUT"

          echo "Generated release notes:"
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release.outputs.current_tag }}" \
            --title "${{ steps.release.outputs.current_tag }}" \
            --notes-file release-notes.md \
            --generate-notes=false